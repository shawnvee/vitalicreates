
<!DOCTYPE html>
<html>
<head>
    <title>CSS3 Borders</title>

    <style>
        div {
            background: orange;
            width: 300px;
            padding: 10px 40px;
            border-radius: 50px;
            border-style: solid;
            box-shadow: 10px 10px 5px #888888;
            -moz-border-radius: 50px;
            -moz-box-shadow: 10px 10px 5px #888888;
        }
    </style>
</head>

<body>

    <div>
        The border-radius property allows you to add rounded corners to elements.
    </div>

</body>
</html>
