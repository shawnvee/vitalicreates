
<!DOCTYPE html>
<html>
<head>
    <title>CSS3 Animation - Three Images</title>

    <style>
        @-webkit-keyframes myAnimation {
            0% { opacity: 1; }
            33% { opacity: 0; }
            66% { opacity: 0; }
            100% { opacity: 1; }
        }

        @keyframes myAnimation {
            0% { opacity: 1; }
            33% { opacity: 0; }
            66% { opacity: 0; }
            100% { opacity: 1; }
        }

        #f1 img {
            position: absolute;

            -webkit-animation-name: myAnimation;
            -webkit-animation-timing-function: ease-in-out;
            -webkit-animation-iteration-count: infinite;
            -webkit-animation-duration: 15s;

            animation-name: myAnimation;
            animation-timing-function: ease-in-out;
            animation-iteration-count: infinite;
            animation-duration: 15s;
        }

        #f1 img:nth-of-type(1) {
            -webkit-animation-delay: 10s;
            animation-delay: 10s;
        }

        #f1 img:nth-of-type(2) {
            -webkit-animation-delay: 5s;
            animation-delay: 5s;
        }

        #f1 img:nth-of-type(3) {
            -webkit-animation-delay: 0s;
            animation-delay: 0s;
        }
    </style>
</head>

<body>

    <div id="f1">
        <img src="img1.png" width="100%" height="100%" alt="First image">
        <img src="img2.png" width="100%" height="100%" alt="Second image">
        <img src="img3.png" width="100%" height="100%" alt="Third image">
    </div>

</body>
</html>
