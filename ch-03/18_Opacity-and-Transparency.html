
<!DOCTYPE html>
<html>
<head>
    <title>Opacity and Transparency</title>

    <style>
        .images {
            float: left;
            width: 200px;
            height: 200px;
            margin: 5px;
            border-style: groove;
        }

        img {
            opacity: 0.5;
            filter: alpha(opacity=40);
        }

        img:hover {
            opacity: 1.0;
            filter: alpha(opacity=100);
        }
    </style>
</head>

<body>

    <img class="images" src="img1.png">
    <img class="images" src="img2.png">

</body>
</html>
