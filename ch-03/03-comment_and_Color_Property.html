
<!DOCTYPE html>
<html>
<head>
    <style>
        /* Body background color set using a HEX code */
        body {background-color: #f2f2f2;}

        /* Main heading font and background colors set using names */
        h1 {color:white;}
        h1 {background-color:deepskyblue;}

        /* Used RGB values for paragraph with a class */
        p.ex {color:rgb(255,255,255);}
        p.ex {background-color:rgb(0,112,192);}
    </style>
</head>
<body>
    <h1>Paragraph Heading</h1>
    <p class="ex">This is a paragraph with class="ex".</p>
    <p>This is an ordinary paragraph without any color applied.</p>
</body>
</html>
